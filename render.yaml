# Render Blueprint — deploys the whole app (backend + both Next.js frontends,
# all in one container, see Dockerfile) plus a free Postgres database.
# Free-tier Postgres on Render expires after 90 days — a known limitation,
# not something to work around here; re-provision when that happens.
#
# ANTHROPIC_API_KEY and TENANT_CRED_ENCRYPTION_KEY (both sync: false) must be
# set manually once in the Render dashboard after the first deploy — never
# store real secrets in this file.
services:
  - type: web
    name: lala-minihr
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lala-minihr-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SAAS_ADMIN_JWT_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      # NFR-2: AES-256-GCM key for Tenant.lineChannelSecretEnc/lineChannelAccessTokenEnc
      # (see EncryptionService). Must decode from base64 to EXACTLY 32 bytes or the
      # app throws at boot — generateValue's format isn't guaranteed to satisfy that,
      # so this is set manually. Generate one with:
      #   node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
      # Without it, EncryptionService silently falls back to a well-known insecure
      # dev key (safe for localhost, never acceptable here) — set this before any
      # tenant configures real LINE credentials on this environment.
      - key: TENANT_CRED_ENCRYPTION_KEY
        sync: false
      - key: WEB_ADMIN_URL
        value: https://lala-minihr.onrender.com/admin

databases:
  - name: lala-minihr-db
    plan: free
    databaseName: lala_minihr
    user: lala_minihr
